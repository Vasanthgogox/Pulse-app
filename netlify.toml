[build]
  command = "npm run build:web"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# SPA client routes only. Existing files under dist/ are served first; missing
# hashed *.js from an older deploy fall through to index.html (HTML as JS →
# "Unexpected token '<'"). public/_headers keeps index.html uncached; see
# lib/webDeployRecovery.ts for one-shot reload after deploy.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
