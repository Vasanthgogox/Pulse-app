[build]
  command = "npm run build:web && npm run build:admin"
  publish = "dist"

[build.environment]
  NODE_VERSION  = "20"
  # Use cached packages before hitting the registry
  NPM_FLAGS     = "--prefer-offline --legacy-peer-deps"
  # Expo export is memory-hungry; give it headroom
  NODE_OPTIONS  = "--max-old-space-size=4096"
  CI            = "true"
  VITE_SUPABASE_URL = "https://nafxpivddesgsrthmosv.supabase.co"
  # VITE_ADMIN_TOKEN and VITE_SUPABASE_SERVICE_ROLE_KEY must be set in
  # Netlify Dashboard → Site settings → Environment variables (never commit secrets)

# Dependency install: Netlify caches npm from package-lock.json (no custom plugin).
# Keep NODE_VERSION + .nvmrc aligned so cache keys stay stable.

[functions]
  directory = "netlify/functions"

# SPA client routes only. Existing files under dist/ are served first; missing
# hashed *.js from an older deploy fall through to index.html (HTML as JS →
# "Unexpected token '<'"). public/_headers keeps index.html uncached; see
# lib/webDeployRecovery.ts for one-shot reload after deploy.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Content-hashed chunks — safe to cache forever.
# Netlify auto-serves .br / .gz sidecars (created by scripts/compress-dist.js)
# based on Accept-Encoding; no manual Content-Encoding header needed.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ops-9f3a2c/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ops-9f3a2c/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
