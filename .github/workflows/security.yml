# Security gates: dependency audit and secret scanning.
# Fails PR if npm audit has high/critical or if TruffleHog finds secrets.
name: Security Scan
on:
  pull_request:
    branches: [main, develop]
jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high
      - name: Example env files contain no real secrets
        run: ./scripts/check-env-example-no-secrets.sh

  secrets:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.sha }}
