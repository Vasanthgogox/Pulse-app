<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
    <!-- Accessibility tags -->
    <title>Friendly 3D AI Assistant</title>
    <desc>A cute, 3D-style animated AI chatbot with a white casing, blue joints, glowing face, and a waving arm.</desc>

    <defs>
        <!-- 3D White Casing Material -->
        <linearGradient id="whiteMat" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="60%" stop-color="#e6edf5" />
            <stop offset="100%" stop-color="#b8cce0" />
        </linearGradient>

        <!-- 3D Tesla Red Material for Ears, Joints, Antenna -->
        <linearGradient id="redMat" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff6b6b" />
            <stop offset="50%" stop-color="#e82127" />
            <stop offset="100%" stop-color="#991216" />
        </linearGradient>

        <!-- Dark Screen Material -->
        <linearGradient id="screenMat" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1a2436" />
            <stop offset="100%" stop-color="#080c14" />
        </linearGradient>

        <!-- 3D Grey Metal Material for Arms/Claws -->
        <linearGradient id="metalMat" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="50%" stop-color="#b6c5d6" />
            <stop offset="100%" stop-color="#8095ad" />
        </linearGradient>

        <!-- Glowing Light Effect for Eyes and Mouth -->
        <filter id="screenGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur1" />
            <feGaussianBlur stdDeviation="12" result="blur2" />
            <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Soft Drop Shadow for 3D depth between body parts -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#06182c" flood-opacity="0.18" />
        </filter>
        
        <!-- Heavy Shadow for the Head -->
        <filter id="headShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#06182c" flood-opacity="0.25" />
        </filter>
    </defs>

    <style>
        /* Interactive Hover Scaling */
        .bot-interactive {
            transform-origin: 200px 240px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        .bot-interactive:hover {
            transform: scale(1.04);
        }

        /* Smooth Vertical Floating */
        .bot-float {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* Waving Arm Animation */
        .arm-wave {
            transform-origin: 150px 240px; /* Shoulder pivot */
            animation: wave 2.5s ease-in-out infinite; /* Slightly faster for a cheerful wave */
        }
        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-25deg); } /* Negative rotation moves the arm OUTWARD, away from the head */
        }

        /* Ambient Background Glow Pulsing */
        .bot-glow {
            transform-origin: 200px 200px;
            animation: glowPulse 4s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(1.05); }
        }

        /* Blinking Eyes */
        .eye {
            animation: blink 5s infinite;
        }
        /* Centers updated to match the 3D face eyes */
        .eye-l { transform-origin: 165px 135px; }
        .eye-r { transform-origin: 235px 135px; }
        @keyframes blink {
            0%, 46%, 49%, 100% { transform: scaleY(1); }
            47.5% { transform: scaleY(0.1); }
        }

        /* Sequential Typing Dots */
        .dot {
            animation: typePulse 1.5s infinite ease-in-out;
        }
        .dot-1 { transform-origin: 170px 430px; animation-delay: 0s; }
        .dot-2 { transform-origin: 200px 430px; animation-delay: 0.2s; }
        .dot-3 { transform-origin: 230px 430px; animation-delay: 0.4s; }
        @keyframes typePulse {
            0%, 100% { transform: translateY(0) scale(0.7); opacity: 0.4; }
            50% { transform: translateY(-4px) scale(1.1); opacity: 1; }
        }
    </style>

    <!-- Main Wrapper handling the hover interaction -->
    <g class="bot-interactive">
        
        <!-- Glowing background ambient aura -->
        <circle class="bot-glow" cx="200" cy="200" r="140" fill="#ffffff" filter="url(#screenGlow)" />

        <!-- Wrapper handling the continuous floating animation -->
        <g class="bot-float">
            
            <!-- ================= LEFT ARM (Visual Right, Resting) ================= -->
            <g id="arm-left" filter="url(#shadow)">
                <!-- Shoulder Joint -->
                <circle cx="260" cy="240" r="12" fill="url(#metalMat)" />
                <!-- Arm Segments -->
                <circle cx="270" cy="255" r="11" fill="url(#metalMat)" />
                <circle cx="280" cy="270" r="11" fill="url(#metalMat)" />
                <circle cx="288" cy="285" r="11" fill="url(#metalMat)" />
                <!-- Red Cuff -->
                <rect x="275" y="300" width="36" height="24" rx="10" fill="url(#redMat)" transform="rotate(-15 293 312)" />
                <!-- Grey Claw (C-shape opening bottom-right) -->
                <path d="M 283 340 A 20 20 0 1 0 315 320" fill="none" stroke="url(#metalMat)" stroke-width="14" stroke-linecap="round" />
            </g>

            <!-- ================= RIGHT ARM (Visual Left, Waving) ================= -->
            <g class="arm-wave" filter="url(#shadow)">
                <!-- Shoulder Joint -->
                <circle cx="150" cy="240" r="12" fill="url(#metalMat)" />
                <!-- Arm Segments -->
                <circle cx="132" cy="228" r="11" fill="url(#metalMat)" />
                <circle cx="116" cy="214" r="11" fill="url(#metalMat)" />
                <circle cx="106" cy="196" r="11" fill="url(#metalMat)" />
                <circle cx="102" cy="176" r="11" fill="url(#metalMat)" />
                <!-- Red Cuff -->
                <rect x="84" y="146" width="36" height="24" rx="10" fill="url(#redMat)" transform="rotate(15 102 158)" />
                <!-- Grey Claw (C-shape opening top-left) -->
                <path d="M 83 135 A 20 20 0 1 1 115 125" fill="none" stroke="url(#metalMat)" stroke-width="14" stroke-linecap="round" />
            </g>

            <!-- ================= TORSO & NECK ================= -->
            <g id="body" filter="url(#shadow)">
                <!-- Neck Joint -->
                <rect x="180" y="195" width="40" height="35" rx="12" fill="url(#metalMat)" />
                <!-- Main White Torso -->
                <rect x="140" y="215" width="120" height="110" rx="45" fill="url(#whiteMat)" />
                <!-- Torso Specular Highlight -->
                <path d="M 155 225 Q 200 220 245 225 A 35 35 0 0 1 250 240 Q 200 235 150 240 A 35 35 0 0 1 155 225 Z" fill="#ffffff" opacity="0.6"/>
            </g>

            <!-- ================= HEAD GROUP ================= -->
            <g id="head" filter="url(#headShadow)">
                <!-- Red Ears -->
                <rect x="95" y="115" width="30" height="60" rx="15" fill="url(#redMat)" />
                <rect x="275" y="115" width="30" height="60" rx="15" fill="url(#redMat)" />
                
                <!-- Antenna -->
                <rect x="195" y="45" width="10" height="40" rx="5" fill="url(#whiteMat)" />
                <circle cx="200" cy="35" r="14" fill="url(#redMat)" />
                <!-- Antenna Highlight -->
                <circle cx="196" cy="31" r="4" fill="#ffffff" opacity="0.6" />

                <!-- Main White Head Casing -->
                <rect x="105" y="80" width="190" height="130" rx="50" fill="url(#whiteMat)" />
                <!-- Head Specular Highlight (Glossy Plastic Look) -->
                <rect x="125" y="86" width="150" height="14" rx="7" fill="#ffffff" opacity="0.7" />

                <!-- Dark Screen Face -->
                <rect x="120" y="95" width="160" height="96" rx="35" fill="url(#screenMat)" />
                <!-- Screen Glass Highlight -->
                <rect x="135" y="100" width="130" height="10" rx="5" fill="#ffffff" opacity="0.12" />

                <!-- Glowing Facial Features -->
                <g id="face-glow" fill="#ffffff" filter="url(#screenGlow)">
                    <!-- Left Eye -->
                    <circle class="eye eye-l" cx="165" cy="135" r="12" />
                    <!-- Right Eye -->
                    <circle class="eye eye-r" cx="235" cy="135" r="12" />
                    <!-- Friendly Curved Smile -->
                    <path d="M 160 155 Q 200 185 240 155" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" />
                </g>

                <!-- Subtle Red Aura around eyes to match the image -->
                <g id="face-red" fill="none" stroke="#ff6b6b" stroke-width="3" opacity="0.8" filter="url(#screenGlow)">
                    <circle class="eye eye-l" cx="165" cy="135" r="12" />
                    <circle class="eye eye-r" cx="235" cy="135" r="12" />
                    <path d="M 160 155 Q 200 185 240 155" stroke-linecap="round" />
                </g>
            </g>
        </g>

        <!-- ================= TYPING INDICATOR ================= -->
        <!-- Pill Container placed below the bot, static relative to the float -->
        <g id="typing-indicator" filter="url(#shadow)">
            <rect x="150" y="415" width="100" height="30" rx="15" fill="#ffffff" opacity="0.9" />

            <!-- Animated Red Dots -->
            <circle class="dot dot-1" cx="170" cy="430" r="6" fill="#e82127" />
            <circle class="dot dot-2" cx="200" cy="430" r="6" fill="#e82127" />
            <circle class="dot dot-3" cx="230" cy="430" r="6" fill="#e82127" />
        </g>
        
    </g>
</svg>